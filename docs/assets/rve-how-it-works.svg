<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" width="720" height="590" role="img" aria-label="RVE 工作原理：从成片逆向还原到可导入 NLE 的时间线"><title>RVE 工作原理</title><desc>主链路：成片视频 → 探测+切镜 → EditSpec → 转场判定 → 导出器 → NLE 时间线；下方为贯穿全链路的组织与证据结构：案例库、适配器、会话路由、工作区、独立校验。</desc><style>svg{--bg:#FFFFFF;--surface:#F7F7F8;--surface-muted:#EFEFF2;--text:#171717;--text-muted:#52525B;--border:rgba(23, 23, 23, 0.12);--brand:#0FDC78;--brand-on:#004D26;--brand-text:#004D26;font-family:'PingFang SC','Microsoft YaHei','Hiragino Sans GB',system-ui,-apple-system,'Segoe UI',sans-serif;}text{fill:var(--text)}.h{font-size:16px;font-weight:600}.lg{font-size:12px;fill:var(--text-muted)}.sec{font-size:12px;font-weight:600;fill:var(--text-muted)}.nd{font-size:14px;font-weight:600}.nd-b{fill:var(--brand-on)}.sb{font-size:12px;fill:var(--text-muted)}.sb-b{font-size:12px;fill:var(--brand-on)}.chip{font-size:12px;font-weight:500}.chip-b{fill:var(--brand-text)}.desc{font-size:12px;fill:var(--text-muted)}.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}.lnk{fill:none;stroke:var(--brand);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style><defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="var(--brand)"/></marker></defs><rect x="0" y="0" width="720" height="590" fill="var(--bg)"/><text x="40" y="34" class="h">RVE 工作原理：成片 → 可导入时间线</text><line x1="466" y1="28" x2="490" y2="28" stroke="var(--brand)" stroke-width="2" stroke-linecap="round"/><text x="498" y="32" class="lg">主链路</text><rect x="552" y="21" width="12" height="12" rx="3" fill="var(--brand)"/><text x="570" y="32" class="lg">唯一权威结构</text><path class="lnk" d="M230 107 L265 107" marker-end="url(#arr)"/><path class="lnk" d="M455 107 L490 107" marker-end="url(#arr)"/><path class="lnk" d="M585 142 L585 212" marker-end="url(#arr)"/><path class="lnk" d="M490 247 L455 247" marker-end="url(#arr)"/><path class="lnk" d="M265 247 L230 247" marker-end="url(#arr)"/><rect x="40" y="72" width="190" height="70" rx="35" fill="var(--surface)" stroke="var(--border)"/><text x="135" y="103" class="nd" text-anchor="middle">成片视频</text><text x="135" y="124" class="sb" text-anchor="middle">任意 NLE 导出</text><rect x="265" y="72" width="190" height="70" rx="8" fill="var(--surface)" stroke="var(--border)"/><text x="360" y="103" class="nd" text-anchor="middle">探测 + 切镜</text><text x="360" y="124" class="sb" text-anchor="middle">ffprobe · scenedetect</text><rect x="490" y="72" width="190" height="70" rx="8" fill="var(--brand)" stroke="var(--brand)"/><text x="585" y="103" class="nd nd-b" text-anchor="middle">EditSpec</text><text x="585" y="124" class="sb-b" text-anchor="middle">秒锚定 · 铺满全轴</text><rect x="490" y="212" width="190" height="70" rx="8" fill="var(--surface)" stroke="var(--border)"/><text x="585" y="243" class="nd" text-anchor="middle">转场判定</text><text x="585" y="264" class="sb" text-anchor="middle">hard / dissolve / fade</text><rect x="265" y="212" width="190" height="70" rx="8" fill="var(--surface)" stroke="var(--border)"/><text x="360" y="243" class="nd" text-anchor="middle">导出器</text><text x="360" y="264" class="sb" text-anchor="middle">FCP7 XML · EDL · OTIO</text><rect x="40" y="212" width="190" height="70" rx="35" fill="var(--surface)" stroke="var(--border)"/><text x="135" y="243" class="nd" text-anchor="middle">NLE 时间线</text><text x="135" y="264" class="sb" text-anchor="middle">Premiere · Resolve</text><text x="40" y="326" class="sec">贯穿结构</text><rect x="40" y="338" width="640" height="38" rx="8" fill="var(--surface)" stroke="var(--border)"/><rect x="52" y="347" width="96" height="20" rx="6" fill="var(--surface-muted)"/><text x="100" y="361" class="chip chip-b" text-anchor="middle">案例库</text><text x="162" y="361" class="desc">4 份配方：合成硬切/溶解/淡出 + ToS 片段 · 一键复现并校验期望指标</text><rect x="40" y="384" width="640" height="38" rx="8" fill="var(--surface)" stroke="var(--border)"/><rect x="52" y="393" width="96" height="20" rx="6" fill="var(--surface-muted)"/><text x="100" y="407" class="chip" text-anchor="middle">适配器</text><text x="162" y="407" class="desc">ffprobe / scenedetect 薄适配 · 不 vendor 上游源码</text><rect x="40" y="430" width="640" height="38" rx="8" fill="var(--surface)" stroke="var(--border)"/><rect x="52" y="439" width="96" height="20" rx="6" fill="var(--surface-muted)"/><text x="100" y="453" class="chip" text-anchor="middle">会话路由</text><text x="162" y="453" class="desc">10 个 MCP 工具 + 6 个 CLI 子命令 · 唯一对外入口</text><rect x="40" y="476" width="640" height="38" rx="8" fill="var(--surface)" stroke="var(--border)"/><rect x="52" y="485" width="96" height="20" rx="6" fill="var(--surface-muted)"/><text x="100" y="499" class="chip" text-anchor="middle">工作区</text><text x="162" y="499" class="desc">每 spec 一目录：<tspan class="mono">spec.json</tspan> + <tspan class="mono">receipts/</tspan> · 证据落盘</text><rect x="40" y="522" width="640" height="38" rx="8" fill="var(--surface)" stroke="var(--border)"/><rect x="52" y="531" width="96" height="20" rx="6" fill="var(--surface-muted)"/><text x="100" y="545" class="chip" text-anchor="middle">独立校验</text><text x="162" y="545" class="desc">第二实现回读导出物 · 不 <tspan class="mono">import</tspan> 任何 <tspan class="mono">rve.*</tspan> 模块</text></svg>